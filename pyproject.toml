[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presscheck"
version = "1.0.0"
description = "Local-first PDF print preflight for designers and production teams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akhil Alladi" }]
dependencies = ["PyMuPDF>=1.24,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
presscheck = "presscheck.cli:main"

[tool.setuptools.packages.find]
include = ["presscheck*"]

[tool.setuptools.package-data]
presscheck = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
