name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . --select E4,E7,E9,F
      - run: python -m compileall -q presscheck scripts
      - run: pytest -q
      - name: Smoke-test deployed Render API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRESSCHECK_API_BASE_URL: https://presscheck-api-akhilalladi-tamq.onrender.com
        run: python scripts/smoke_backend.py
